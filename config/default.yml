schema_version: 1
factory:
  user: coder
  home: /home/coder
  workspace: /home/coder/Dev
  start_services: true
  enable_linger: true
  profiles:
    agents: true
    development: true
    firstmate: true
    docker: true
    tailscale: false
    desktop: false
    fleet_guards: false
  herdr:
    theme: catppuccin
    toast_delivery: herdr
    agent_panel_sort: spaces
    headless_cols: 120
    headless_rows: 40
    # Agent sidebar layout; docs/herdr.md explains each line.
    sidebar_width: 40
    sidebar_max_width: 48
    sidebar_agent_rows: |
      [
        [
          "state_icon",
          { token = "$who", rules = [{ equals = "firstmate", fg = "#89b4fa", bold = true }, { starts_with = "2ndmate-", fg = "#cba6f7" }, { starts_with = "└", fg = "#94e2d5" }] },
        ],
        [
          { token = "state_icon", fg = "#1e1e2e" },
          { token = "terminal_title", dim = true },
        ],
        [
          { token = "$refs", fg = "#89b4fa" },
        ],
      ]
    # Pinned to the catppuccin base so the hidden indent dot on line 2 blends
    # in.
    sidebar_bg: "#1e1e2e"
  browser_prune:
    enabled: true
    idle_seconds: 7200
    poll_seconds: 300
    max_gap_seconds: 900
  docker:
    init: true
    live_restore: true
  fleet:
    supabase_project_id: swarms-shared
    fixture_archive: ""
    worktree_pools:
      - .treehouse/swarms-platform-bcc5ea
  browsers:
    obscura_version: '0.2.2'
    obscura_sha256: c1b4548e36549a0228c39c1cc842df425bc7253af2b0a56bd2a538d8ff7e3406
    idle_timeout_min: 30
  firstmate:
    # Upstream Firstmate's main, fetched and fast-forwarded on every apply so a
    # host stays current - which is also why it must not be re-pinned to a sha.
    # Override url in .local/host.yml to track a fork instead.
    url: https://github.com/kunchenguid/firstmate.git
  desktop:
    display: 1
    novnc_port: 6080
    geometry: 1440x900
