# NO ROUTERS. These ids reach the providers directly through omp's own provider
# clients; nothing sits between omp and the API. Account rotation is native to
# omp - it pools several accounts of the same provider itself - so needing more
# than one account is never a reason to reintroduce a gateway. A router,
# gateway, or gateway-prefixed model id comes back only by explicit operator
# decision. Keep this note in agreement with config/crew-dispatch.json.
modelRoles:
  designer: anthropic/claude-fable-5-1
  smol: cerebras/qwen-3.8-27b:high
  slow: anthropic/claude-fable-5-1:xhigh
  vision: anthropic/claude-sonnet-5
  plan: anthropic/claude-fable-5-1
  commit: anthropic/claude-sonnet-5
  tiny: anthropic/claude-sonnet-5
  advisor: anthropic/claude-sonnet-5
  Kimi: kimi-code/k3
  task: anthropic/claude-opus-5
  subagent: anthropic/claude-opus-5
  default: anthropic/claude-opus-5
theme:
  dark: dark-rose-pine
symbolPreset: nerd
defaultThinkingLevel: auto
hideThinkingBlock: false
autocompleteMaxVisible: 10
steeringMode: one-at-a-time
interruptMode: immediate
includeModelInPrompt: false
readLineNumbers: true
omitThinking: true
textVerbosity: low
cycleOrder:
- smol
- default
- slow
- subagent
colorBlindMode: false
statusLine:
  preset: custom
  compactThinkingLevel: true
  leftSegments:
  - path
  - git
  - model
  - mode
  rightSegments:
  - context_pct
  - token_rate
  - subagents
  - cost
  - time_spent
  segmentOptions:
    model:
      showThinkingLevel: true
    git:
      showBranch: true
  showHookStatus: true
  sessionAccent: false
  separator: powerline
  transparent: true
composer:
  shape: borderless
mnemopi:
  noEmbeddings: true
retry:
  fallbackChains:
    anthropic/claude-fable-5-1:
    - anthropic/claude-opus-5
    anthropic/claude-sonnet-5:
    - anthropic/claude-fable-5-1
    - anthropic/claude-opus-5
    default:
    - anthropic/claude-opus-5
  maxDelayMs: 60000
