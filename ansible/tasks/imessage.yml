---
# Optional iMessage bridge to Firstmate over a Photon Spectrum line
# (docs/imessage.md). Runs only when factory.imessage is set, which belongs in
# .local/host.yml only.
#
#   * the service runs from a copy of imessage/ under the account's home, with
#     the latest spectrum-ts, so it keeps working without the checkout
#   * the Photon project id and secret are read from ~/super.env when the
#     unit starts; they are never written by this playbook
#   * the unit holds the owner's phone number, so it is mode 0600

- name: Ensure the iMessage bridge directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ factory_imessage_dir }}"
    - "{{ factory_local_bin }}"
    - "{{ factory_user_units }}/default.target.wants"

- name: Install the iMessage bridge service
  ansible.builtin.copy:
    src: "{{ code_factory_repo }}/imessage/{{ item }}"
    dest: "{{ factory_imessage_dir }}/{{ item }}"
    mode: "0644"
    remote_src: true
  loop: [bridge.ts, desk.ts]
  notify: restart fm-imessage

- name: Install the iMessage commands
  ansible.builtin.copy:
    src: "{{ code_factory_repo }}/imessage/{{ item }}"
    dest: "{{ factory_local_bin }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop: [fm-imessage, fm-location]

- name: Read the installed spectrum-ts version
  ansible.builtin.slurp:
    src: "{{ factory_imessage_dir }}/node_modules/spectrum-ts/package.json"
  register: factory_imessage_sdk
  failed_when: false
  check_mode: false

- name: Record whether spectrum-ts needs the resolved release
  ansible.builtin.set_fact:
    factory_imessage_sdk_stale: >-
      {{ factory_imessage_sdk.content is not defined
         or (factory_imessage_sdk.content | b64decode | from_json).version != factory_latest['spectrum-ts'] }}

- name: Report the spectrum-ts install that check mode cannot perform
  ansible.builtin.debug:
    msg: "check mode: would run `bun add` in {{ factory_imessage_dir }} for spectrum-ts {{ factory_latest['spectrum-ts'] }}."
  when:
    - ansible_check_mode
    - factory_imessage_sdk_stale | bool

# bun checks the integrity the registry records for the resolved version.
- name: Install the latest spectrum-ts
  ansible.builtin.command:
    argv:
      - "{{ factory_local_bin }}/bun"
      - add
      - --exact
      - "spectrum-ts@{{ factory_latest['spectrum-ts'] }}"
    chdir: "{{ factory_imessage_dir }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - factory_imessage_sdk_stale | bool
  notify: restart fm-imessage

- name: Render the iMessage bridge unit
  ansible.builtin.template:
    src: fm-imessage.service.j2
    dest: "{{ factory_user_units }}/fm-imessage.service"
    mode: "0600"
  notify:
    - reload user systemd
    - restart fm-imessage

- name: Statically enable the iMessage bridge
  ansible.builtin.file:
    src: "{{ factory_user_units }}/fm-imessage.service"
    dest: "{{ factory_user_units }}/default.target.wants/fm-imessage.service"
    state: link
    force: true
    follow: false

- name: Enable and start the iMessage bridge
  ansible.builtin.systemd_service:
    scope: user
    name: fm-imessage.service
    enabled: true
    state: started
  environment: "{{ factory_user_systemd_env }}"
  when: factory_manage_services | bool
