---
# The fleet guards' user units (factory_fleet_units). Older releases installed
# the same units as flotilla-*: every apply stops any that remain, deletes their
# files and enablement links, and deletes the old Docker guard's allowlist.
# flotilla-shared-supabase.service is never stopped: its ExecStop runs
# `supabase stop`, and the shared stack must keep running through the rename.
# Its file is deleted instead and crewship-shared-supabase.service adopts the
# running stack (check.sh is idempotent). A host without the old units changes
# nothing. With start_services false nothing is stopped or started; files are
# still converged.

- name: Ensure the user unit directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "0755"
  become: true
  loop:
    - "{{ factory_user_units }}"
    - "{{ factory_user_units }}/default.target.wants"
    - "{{ factory_user_units }}/timers.target.wants"

- name: Find the retired flotilla units
  ansible.builtin.stat:
    path: "{{ factory_user_units }}/{{ item }}"
    get_checksum: false
  become: true
  loop: "{{ factory_fleet_retired_units }}"
  register: factory_fleet_retired
  changed_when: false
  check_mode: false

- name: Stop the retired flotilla timers and paths
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.item }}"
    state: stopped
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_systemd_env }}"
  loop: "{{ factory_fleet_retired.results | selectattr('stat.exists') | selectattr('item', 'match', '.*\\.(timer|path)$') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: factory_manage_services | bool

- name: Stop the other retired flotilla units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.item }}"
    state: stopped
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_systemd_env }}"
  loop: "{{ factory_fleet_retired.results | selectattr('stat.exists') | rejectattr('item', 'match', '.*\\.(timer|path)$') | rejectattr('item', 'equalto', 'flotilla-shared-supabase.service') | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: factory_manage_services | bool

# Deleting the enablement links is the disable; the links are static.
- name: Delete the retired flotilla units and their enablement links
  ansible.builtin.file:
    path: "{{ factory_user_units }}/{{ item[1] }}{{ item[0] }}"
    state: absent
  become: true
  loop: "{{ factory_fleet_retired_units | product(['', 'default.target.wants/', 'timers.target.wants/']) | list }}"
  loop_control:
    label: "{{ item[1] }}{{ item[0] }}"
  notify: reload user systemd

- name: Reload user systemd after deleting the retired units
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_systemd_env }}"
  when:
    - factory_manage_services | bool
    - factory_fleet_retired.results | selectattr('stat.exists') | list | length > 0

- name: Clear the retired shared Supabase unit's state
  ansible.builtin.command:
    argv: [systemctl, --user, reset-failed, flotilla-shared-supabase.service]
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_systemd_env }}"
  changed_when: false
  failed_when: false
  when:
    - factory_manage_services | bool
    - factory_fleet_retired.results | selectattr('stat.exists') | selectattr('item', 'equalto', 'flotilla-shared-supabase.service') | list | length > 0

- name: Delete the retired Docker guard allowlist
  ansible.builtin.file:
    path: "{{ factory_fleet_doctor_dir }}/docker-guard-allow.txt"
    state: absent
  become: true

- name: Render the fleet units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ factory_user_units }}/{{ item }}"
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "0644"
  become: true
  loop: "{{ factory_fleet_units }}"
  notify:
    - reload user systemd
    - restart fleet timers

- name: Statically enable the fleet units
  ansible.builtin.file:
    src: "{{ factory_user_units }}/{{ item.unit }}"
    dest: "{{ factory_user_units }}/{{ item.wants }}/{{ item.unit }}"
    state: link
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    force: true
    follow: false
  become: true
  loop: "{{ factory_fleet_enabled_units }}"
  loop_control:
    label: "{{ item.unit }}"

- name: Enable and start the fleet units
  ansible.builtin.systemd_service:
    scope: user
    name: "{{ item.unit }}"
    enabled: true
    state: started
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_systemd_env }}"
  loop: "{{ factory_fleet_enabled_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: factory_manage_services | bool

- name: Report the deferred fleet start
  ansible.builtin.debug:
    msg: >-
      start_services is false: fleet units are written and statically enabled
      but not started here. On a real host crewship-shared-supabase.service
      brings the stack up at login and generates
      {{ factory_shared_supabase_dir }}/swarms-platform.env.local.
  when: not (factory_manage_services | bool)
