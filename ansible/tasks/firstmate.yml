---
# Firstmate: a public clone that tracks the default branch `main` of
# factory.firstmate.url (upstream Firstmate unless .local/host.yml overrides
# it), plus its gitignored dispatch settings.
#
# Every apply fetches and fast-forwards `main`, so tracking it is how a host
# stays current - which is also why it must not be re-pinned to a sha.
#
# Safety rules (contract + docs/security.md):
#   * `origin/main` is resolved once per run; that captured sha is what this
#     run installs and what tasks/verify.yml asserts, so a push landing
#     mid-run cannot turn a correct apply into a failed verification
#   * a fresh clone ends on branch `main` tracking `origin/main` - never a
#     detached HEAD, which breaks Firstmate's own git handling
#   * an existing checkout is never force-checked-out, reset, stashed or
#     cleaned. Dirty, diverged or independently advanced trees are refused and
#     the play stops so a human can look
#   * a clean checkout strictly behind the target on `main` is fast-forwarded
#     only
#   * provisioning never runs Firstmate startup or fleet restore

- name: Check for an existing Firstmate checkout
  ansible.builtin.stat:
    path: "{{ factory_firstmate_dir }}/.git"
    get_checksum: false
  become: true
  register: factory_fm_git
  changed_when: false
  check_mode: false

- name: Report the Firstmate clone that check mode cannot preview
  ansible.builtin.debug:
    msg: >-
      check mode: would clone {{ factory_cfg.firstmate.url }} into
      {{ factory_firstmate_dir }} on branch main, tracking origin/main.
  when:
    - ansible_check_mode
    - not factory_fm_git.stat.exists

# --- fresh clone ------------------------------------------------------------

- name: Clone Firstmate on its default branch
  ansible.builtin.git:
    repo: "{{ factory_cfg.firstmate.url }}"
    dest: "{{ factory_firstmate_dir }}"
    version: main
    update: false
    force: false
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_env }}"
  register: factory_fm_clone
  when:
    - not factory_fm_git.stat.exists
    - not ansible_check_mode

# The clone was created moments ago by this task run and contains no work, so
# naming the branch here cannot destroy anything.
- name: Put the fresh clone on branch main at origin/main
  ansible.builtin.command:
    argv: [git, -C, "{{ factory_firstmate_dir }}", checkout, -B, main, origin/main]
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_env }}"
  changed_when: true
  when: factory_fm_clone.changed | default(false)

- name: Track origin/main from the fresh clone
  ansible.builtin.command:
    argv: [git, -C, "{{ factory_firstmate_dir }}", branch, --set-upstream-to=origin/main, main]
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_env }}"
  changed_when: true
  failed_when: false
  when: factory_fm_clone.changed | default(false)

# --- existing checkout: refuse a dirty tree, then refresh the remote ---------

- name: Inspect the existing checkout
  when: factory_fm_git.stat.exists
  block:
    - name: Read the checked out revision
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", rev-parse, HEAD]
      register: factory_fm_head
      changed_when: false
      check_mode: false

    - name: Read the current branch
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", rev-parse, --abbrev-ref, HEAD]
      register: factory_fm_branch
      changed_when: false
      check_mode: false

    - name: Read the working tree status
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", status, --porcelain, --untracked-files=no]
      register: factory_fm_status
      changed_when: false
      check_mode: false

    - name: Refuse to touch a dirty checkout
      ansible.builtin.assert:
        that:
          - (factory_fm_status.stdout | trim) | length == 0
        fail_msg: >-
          {{ factory_firstmate_dir }} has uncommitted changes. Provisioning
          never resets, stashes or cleans existing work. Commit, push or move
          the changes, then re-run.
        quiet: true

    - name: Fetch origin so origin/main is current
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", fetch, --quiet, origin]
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      # A fetch updates remote-tracking refs only; the working tree and local
      # branches are untouched, so this is not a change to report.
      changed_when: false
      check_mode: false

# --- resolve the target revision once ---------------------------------------
# The fast-forward below and tasks/verify.yml both use this captured sha
# instead of re-reading origin/main later in the run.

- name: Resolve the target revision from origin/main
  ansible.builtin.command:
    argv: [git, -C, "{{ factory_firstmate_dir }}", rev-parse, origin/main]
  become: "{{ factory_become_target | bool }}"
  become_user: "{{ factory_cfg.user }}"
  environment: "{{ factory_user_env }}"
  register: factory_fm_origin_main
  changed_when: false
  check_mode: false
  when: factory_fm_git.stat.exists or (factory_fm_clone.changed | default(false))

- name: Record the target revision this run installs
  ansible.builtin.set_fact:
    factory_firstmate_target: "{{ factory_fm_origin_main.stdout | trim }}"
  when: factory_fm_origin_main.stdout is defined

- name: Report the target revision this run installs
  ansible.builtin.debug:
    msg: >-
      origin/main of {{ factory_cfg.firstmate.url }} resolves to
      {{ factory_firstmate_target }}. That revision is what this run installs
      in {{ factory_firstmate_dir }} and what verification asserts.
  when: factory_firstmate_target is defined

# --- existing checkout: refuse or fast-forward ------------------------------

- name: Reconcile the existing checkout with the target revision
  when: factory_fm_git.stat.exists
  block:
    - name: Test whether the checkout already contains the target revision
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", merge-base, --is-ancestor, "{{ factory_firstmate_target }}", HEAD]
      register: factory_fm_target_is_ancestor
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Test whether the checkout is behind the target revision
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", merge-base, --is-ancestor, HEAD, "{{ factory_firstmate_target }}"]
      register: factory_fm_head_is_ancestor
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Classify the existing checkout
      ansible.builtin.set_fact:
        factory_fm_at_target: "{{ (factory_fm_head.stdout | trim) == factory_firstmate_target }}"
        factory_fm_behind: "{{ factory_fm_head_is_ancestor.rc == 0 and factory_fm_target_is_ancestor.rc != 0 }}"
        factory_fm_ahead: "{{ factory_fm_target_is_ancestor.rc == 0 and factory_fm_head_is_ancestor.rc != 0 }}"
        factory_fm_on_main: "{{ (factory_fm_branch.stdout | trim) == 'main' }}"

    - name: Refuse a checkout that is ahead of the target revision
      ansible.builtin.assert:
        that:
          - not (factory_fm_ahead | bool)
        fail_msg: >-
          {{ factory_firstmate_dir }} is at {{ factory_fm_head.stdout | trim }},
          which is ahead of origin/main ({{ factory_firstmate_target }}): local
          commits that have not been pushed. Moving it backwards would discard
          that work. Push or move those commits, then re-run.
        quiet: true

    - name: Refuse a diverged checkout
      ansible.builtin.assert:
        that:
          - (factory_fm_at_target | bool) or (factory_fm_behind | bool)
        fail_msg: >-
          {{ factory_firstmate_dir }} at {{ factory_fm_head.stdout | trim }} has
          diverged from origin/main ({{ factory_firstmate_target }}). Reconcile
          the branch by hand; provisioning will not force, reset or merge it.
        quiet: true

    - name: Refuse to fast-forward a branch other than main
      ansible.builtin.assert:
        that:
          - factory_fm_on_main | bool
        fail_msg: >-
          {{ factory_firstmate_dir }} is behind origin/main but checked out on
          "{{ factory_fm_branch.stdout | trim }}" instead of main. Switch to
          main yourself; provisioning will not move another branch or a
          detached HEAD.
        quiet: true
      when: factory_fm_behind | bool

    - name: Fast-forward main to the target revision
      ansible.builtin.command:
        argv: [git, -C, "{{ factory_firstmate_dir }}", merge, --ff-only, "{{ factory_firstmate_target }}"]
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      changed_when: true
      when:
        - factory_fm_behind | bool
        - factory_fm_on_main | bool
        - not ansible_check_mode

    - name: Note a detached checkout that already matches the target revision
      ansible.builtin.debug:
        msg: >-
          {{ factory_firstmate_dir }} matches origin/main but HEAD is detached
          ({{ factory_fm_branch.stdout | trim }}). Firstmate expects a named
          branch and verification requires main; run `git checkout main` there.
          Provisioning does not change an existing checkout's branch.
      when:
        - factory_fm_at_target | bool
        - not (factory_fm_on_main | bool)

# --- gitignored dispatch settings ------------------------------------------
# Firstmate already ignores these paths inside its own checkout, so writing
# them leaves the working tree clean and no .gitignore is edited.

- name: Deploy Firstmate dispatch settings
  when: factory_fm_git.stat.exists or not ansible_check_mode
  block:
    - name: Ensure the Firstmate config directory
      ansible.builtin.file:
        path: "{{ factory_firstmate_dir }}/config"
        state: directory
        owner: "{{ factory_cfg.user }}"
        group: "{{ factory_group }}"
      become: true

    - name: Stat the Firstmate config sources
      ansible.builtin.stat:
        path: "{{ code_factory_repo }}/config/{{ item }}"
        get_checksum: false
      loop: "{{ factory_firstmate_config_names }}"
      register: factory_fm_src_stat
      changed_when: false
      check_mode: false

    - name: Stat the Firstmate config destinations
      ansible.builtin.stat:
        path: "{{ factory_firstmate_dir }}/config/{{ item }}"
        get_checksum: false
      become: true
      loop: "{{ factory_firstmate_config_names }}"
      register: factory_fm_dest_stat
      changed_when: false
      check_mode: false

    - name: Write the Firstmate dispatch settings
      ansible.builtin.copy:
        # A trailing slash copies directory contents; plain files copy as-is.
        src: "{{ code_factory_repo }}/config/{{ item.0.item }}{{ '/' if item.0.stat.isdir else '' }}"
        dest: "{{ factory_firstmate_dir }}/config/{{ item.0.item }}"
        owner: "{{ factory_cfg.user }}"
        group: "{{ factory_group }}"
        mode: "{{ '0600' if not item.0.stat.isdir else omit }}"
        directory_mode: "{{ '0700' if item.0.stat.isdir else omit }}"
        remote_src: true
      become: true
      loop: "{{ factory_fm_src_stat.results | zip(factory_fm_dest_stat.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when: >-
        not (factory_firstmate_config_first_write | bool)
        or not (item.1.stat.exists | default(false))
