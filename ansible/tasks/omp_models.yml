---
- name: Check for existing omp models
  ansible.builtin.stat:
    path: "{{ factory_cfg.home }}/.omp/agent/models.yml"
    get_checksum: false
  become: true
  register: factory_omp_models_stat
  check_mode: false

- name: Read existing omp models
  ansible.builtin.slurp:
    path: "{{ factory_cfg.home }}/.omp/agent/models.yml"
  become: true
  register: factory_omp_models_raw
  when: factory_omp_models_stat.stat.exists
  check_mode: false

- name: Merge shipped overrides into omp models
  vars:
    current: "{{ factory_omp_models_raw.content | default('') | b64decode | from_yaml | default({}, true) }}"
    overrides: "{{ lookup('ansible.builtin.file', code_factory_repo ~ '/config/omp-models.yml') | from_yaml }}"
    wanted: "{{ current | combine(overrides, recursive=true) }}"
  ansible.builtin.copy:
    content: "{{ wanted | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ factory_cfg.home }}/.omp/agent/models.yml"
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "0600"
  become: true
  when: wanted != current
