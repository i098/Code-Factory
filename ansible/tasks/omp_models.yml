---
- name: Check for existing omp models
  ansible.builtin.stat:
    path: "{{ factory_cfg.home }}/.omp/agent/{{ item }}"
    get_checksum: false
  become: true
  loop:
    - models.yml
    - models.yaml
    - models.json
  register: factory_omp_models_stat
  check_mode: false

- name: Read existing omp models
  vars:
    existing: "{{ factory_omp_models_stat.results | selectattr('stat.exists') | list }}"
  ansible.builtin.slurp:
    path: "{{ existing[0].stat.path }}"
  become: true
  register: factory_omp_models_raw
  when: existing | length > 0
  check_mode: false

- name: Parse legacy omp models with the installed JSONC parser
  ansible.builtin.command:
    argv:
      - "{{ factory_local_bin }}/bun"
      - --eval
      - 'import { JSONC } from "bun"; console.log(JSON.stringify(JSONC.parse(await Bun.stdin.text())));'
    stdin: "{{ factory_omp_models_raw.content | b64decode }}"
  become: true
  register: factory_omp_models_json
  when: (factory_omp_models_raw.source | default('')).endswith('.json')
  changed_when: false
  check_mode: false

- name: Merge shipped overrides into omp models
  vars:
    current: >-
      {{ (factory_omp_models_json.stdout | from_json
          if (factory_omp_models_raw.source | default('')).endswith('.json')
          else factory_omp_models_raw.content | default('') | b64decode | from_yaml)
         | default({}, true) }}
    overrides: "{{ lookup('ansible.builtin.file', code_factory_repo ~ '/config/omp-models.yml') | from_yaml }}"
    wanted: "{{ current | combine(overrides, recursive=true) }}"
  ansible.builtin.copy:
    content: "{{ wanted | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ factory_cfg.home }}/.omp/agent/models.yml"
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "0600"
  become: true
  when: wanted != current or not factory_omp_models_stat.results[0].stat.exists
