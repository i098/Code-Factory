---
- name: Check for existing omp models
  ansible.builtin.stat:
    path: "{{ factory_cfg.home }}/.omp/agent/{{ item }}"
    get_checksum: false
  become: true
  loop:
    - models.yml
    - models.yaml
    - models.json
  register: factory_omp_models_stat
  check_mode: false

- name: Read existing omp models
  vars:
    existing: "{{ factory_omp_models_stat.results | selectattr('stat.exists') | list }}"
  ansible.builtin.slurp:
    path: "{{ existing[0].stat.path }}"
  become: true
  register: factory_omp_models_raw
  when: existing | length > 0
  check_mode: false

- name: Check for the omp model parser during preview
  ansible.builtin.stat:
    path: "{{ factory_local_bin }}/bun"
    get_checksum: false
  become: true
  register: factory_omp_models_parser
  when:
    - ansible_check_mode
    - factory_omp_models_raw.source is defined
  check_mode: false

- name: Report the missing omp model parser installation
  ansible.builtin.debug:
    msg: "Model merge preview requires Bun installation; the dependent merge is skipped."
  when:
    - ansible_check_mode
    - factory_omp_models_raw.source is defined
    - not (factory_omp_models_parser.stat.executable | default(false))

- name: Parse existing omp models with the installed parser
  ansible.builtin.command:
    argv:
      - "{{ factory_local_bin }}/bun"
      - --eval
      - >-
        import { JSONC, YAML } from "bun";
        console.log(JSON.stringify({{ 'JSONC' if factory_omp_models_raw.source.endswith('.json') else 'YAML' }}.parse(await Bun.stdin.text())));
    stdin: "{{ factory_omp_models_raw.content | b64decode }}"
  become: true
  register: factory_omp_models_parsed
  when:
    - factory_omp_models_raw.source is defined
    - not ansible_check_mode or (factory_omp_models_parser.stat.executable | default(false))
  changed_when: false
  check_mode: false

- name: Merge shipped overrides into omp models
  vars:
    current: "{{ factory_omp_models_parsed.stdout | default('null') | from_json | default({}, true) }}"
    overrides: "{{ lookup('ansible.builtin.file', code_factory_repo ~ '/config/omp-models.yml') | from_yaml }}"
    wanted: "{{ current | combine(overrides, recursive=true) }}"
  ansible.builtin.copy:
    content: "{{ wanted | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ factory_cfg.home }}/.omp/agent/models.yml"
    owner: "{{ factory_cfg.user }}"
    group: "{{ factory_group }}"
    mode: "0600"
  become: true
  when:
    - not ansible_check_mode or factory_omp_models_raw.source is not defined or (factory_omp_models_parser.stat.executable | default(false))
    - wanted != current or not factory_omp_models_stat.results[0].stat.exists
