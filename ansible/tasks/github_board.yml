---
# Optional GitHub board (factory.github_board, docs/github-board.md): a user
# timer runs maintenance/github-board.py, which mirrors Firstmate work items to
# issues and a Project with the host's gh login. No token is written anywhere.
# Without the key, every apply stops and removes the timer, the unit and the
# script, so the host makes no GitHub calls for the board.

- name: Install the GitHub board
  when: factory_cfg.github_board is defined
  block:
    - name: Ensure the GitHub board directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ factory_local_bin }}"
        - "{{ factory_user_units }}/timers.target.wants"

    - name: Install the GitHub board script
      ansible.builtin.copy:
        src: "{{ code_factory_repo }}/maintenance/github-board.py"
        dest: "{{ factory_local_bin }}/github-board.py"
        mode: "0755"
        remote_src: true

    - name: Render the GitHub board unit and timer
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ factory_user_units }}/{{ item }}"
        mode: "0644"
      loop: [github-board.service, github-board.timer]
      notify: reload user systemd

    - name: Statically enable the GitHub board timer
      ansible.builtin.file:
        src: "{{ factory_user_units }}/github-board.timer"
        dest: "{{ factory_user_units }}/timers.target.wants/github-board.timer"
        state: link
        force: true
        follow: false

    - name: Enable and start the GitHub board timer
      ansible.builtin.systemd_service:
        scope: user
        name: github-board.timer
        enabled: true
        state: started
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool

- name: Remove the GitHub board
  when: factory_cfg.github_board is not defined
  block:
    - name: Look for an installed GitHub board timer
      ansible.builtin.stat:
        path: "{{ factory_user_units }}/github-board.timer"
        get_checksum: false
      register: factory_github_board_timer

    - name: Stop the GitHub board timer
      ansible.builtin.systemd_service:
        scope: user
        name: github-board.timer
        state: stopped
      environment: "{{ factory_user_systemd_env }}"
      when:
        - factory_manage_services | bool
        - factory_github_board_timer.stat.exists

    - name: Remove the GitHub board timer, unit and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ factory_user_units }}/timers.target.wants/github-board.timer"
        - "{{ factory_user_units }}/github-board.timer"
        - "{{ factory_user_units }}/github-board.service"
        - "{{ factory_local_bin }}/github-board.py"
      notify: reload user systemd
