---
# Fleet guards: ONE shared local Supabase stack for every swarms-platform lane,
# enforced at every layer that a crewmate can reach (docs/fleet-guards.md).
#
#   * ~/oss-fleet/shared-supabase - the stack's project dir: the latest
#     Supabase CLI from the npm registry, config.toml,
#     check.sh keeper (idempotent start + DDL guard + env template), guard.sql.
#   * ~/oss-fleet/doctor/docker-guard.sh - every hour, removes stopped
#     containers older than crewship.fleet.docker_guard.stopped_hours and
#     reports unclaimed running ones; never volumes, images or kept containers.
#   * ~/oss-fleet/doctor/worktree-env-seed.sh - installs the stack's env file
#     as .env.local in every swarms worktree, plus a `node` wrapper in each
#     pool slot that caps the lane heap; path unit + timer + login.
#   * ~/oss-fleet/doctor/dev-server-reaper.sh - every 2 min, kills next dev /
#     tsc trees in worktrees whose lane is done/paused/blocked, agent-less or
#     idle >= 30 min. Dev servers are throwaway; idle ones filled swap.
#   * ~/oss-fleet/doctor/storage-guard.sh - every 5 min, alerts on disk use
#     (WARN, fill rate) and at CRIT prunes only regenerable Docker data: build
#     cache, dangling images, unused images created more than a week ago
#     (image creation time, not last use).
#   * ~/oss-fleet/doctor/devtools-bridge-reaper.sh - every 10 min, stops
#     attached chrome-devtools-axi bridges (CHROME_DEVTOOLS_AXI_BROWSER_URL
#     set, which chrome-autoprune refuses) whose tree used no CPU and whose
#     session state did not change for 60 min.
#   * ~/.local/bin/supabase - shim refusing lifecycle subcommands.
#
# The database is a read-only test fixture. Its data cannot be provisioned from
# source (the application's migrations do not apply cleanly to an empty
# database), so a fresh host restores it from crewship.fleet.fixture_archive, a
# tarball of the Docker volume. Without the archive and without an existing
# volume the play stops here with instructions rather than starting an empty,
# useless stack.
#
# Everything is idempotent and check-mode safe: file/copy/template preview;
# the Supabase CLI `npm install`, volume restore and the first
# `supabase start` are skipped in check mode and reported instead.

- name: Ensure the fleet directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0755"
  become: true
  loop:
    - "{{ crewship_fleet_dir }}"
    - "{{ crewship_fleet_doctor_dir }}"
    - "{{ crewship_shared_supabase_dir }}"
    - "{{ crewship_shared_supabase_dir }}/supabase"
    - "{{ crewship_local_bin }}"

# --- scripts and static files (repository-owned, always converged) -----------

- name: Install the fleet scripts
  ansible.builtin.copy:
    src: "{{ crewship_fleet_sources }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "{{ item.mode }}"
    remote_src: true
  become: true
  loop:
    - { src: doctor/docker-guard.sh, dest: "{{ crewship_fleet_doctor_dir }}/docker-guard.sh", mode: "0755" }
    - { src: doctor/worktree-env-seed.sh, dest: "{{ crewship_fleet_doctor_dir }}/worktree-env-seed.sh", mode: "0755" }
    - { src: doctor/dev-server-reaper.sh, dest: "{{ crewship_fleet_doctor_dir }}/dev-server-reaper.sh", mode: "0755" }
    - { src: doctor/storage-guard.sh, dest: "{{ crewship_fleet_doctor_dir }}/storage-guard.sh", mode: "0755" }
    - { src: doctor/devtools-bridge-reaper.sh, dest: "{{ crewship_fleet_doctor_dir }}/devtools-bridge-reaper.sh", mode: "0755" }
    - { src: shared-supabase/check.sh, dest: "{{ crewship_shared_supabase_dir }}/check.sh", mode: "0755" }
    - { src: shared-supabase/guard.sql, dest: "{{ crewship_shared_supabase_dir }}/guard.sql", mode: "0644" }
    - { src: shared-supabase/README.md, dest: "{{ crewship_shared_supabase_dir }}/README.md", mode: "0644" }
    - { src: bin/supabase, dest: "{{ crewship_local_bin }}/supabase", mode: "0755" }
  loop_control:
    label: "{{ item.dest }}"

# The Supabase config carries the project id; container names derive from it.
- name: Render the shared stack's Supabase configuration
  ansible.builtin.copy:
    content: >-
      {{ lookup('ansible.builtin.file', crewship_fleet_sources ~ '/shared-supabase/supabase/config.toml')
         | regex_replace('(?m)^project_id = .*$', 'project_id = "' ~ crewship_shared_supabase_project ~ '"') }}
    dest: "{{ crewship_shared_supabase_dir }}/supabase/config.toml"
    owner: "{{ crewship_cfg.user }}"
    group: "{{ crewship_group }}"
    mode: "0644"
  become: true

# --- latest Supabase CLI ------------------------------------------------------

- name: Read the installed Supabase CLI version
  ansible.builtin.command:
    argv: ["{{ crewship_shared_supabase_cli }}", --version]
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  register: crewship_fleet_cli_version
  failed_when: false
  changed_when: false
  check_mode: false

- name: Report the CLI install that check mode cannot perform
  ansible.builtin.debug:
    msg: >-
      check mode: would run `npm install` in {{ crewship_shared_supabase_dir }}
      for supabase {{ crewship_shared_supabase_cli_version }}.
  when:
    - ansible_check_mode
    - (crewship_fleet_cli_version.stdout | default('') | trim) != crewship_shared_supabase_cli_version

# npm checks the integrity the registry records for the resolved version.
- name: Install the latest Supabase CLI
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --prefix
      - "{{ crewship_shared_supabase_dir }}"
      - --no-fund
      - --no-audit
      - --loglevel=error
      - "supabase@{{ crewship_shared_supabase_cli_version }}"
    chdir: "{{ crewship_shared_supabase_dir }}"
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - (crewship_fleet_cli_version.stdout | default('') | trim) != crewship_shared_supabase_cli_version

- name: Confirm the Supabase CLI is the resolved release
  ansible.builtin.command:
    argv: ["{{ crewship_shared_supabase_cli }}", --version]
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  register: crewship_fleet_cli_verified
  changed_when: false
  when: not ansible_check_mode

- name: Assert the Supabase CLI version
  ansible.builtin.assert:
    that:
      - (crewship_fleet_cli_verified.stdout | trim) == crewship_shared_supabase_cli_version
    fail_msg: >-
      {{ crewship_shared_supabase_cli }} reports
      "{{ crewship_fleet_cli_verified.stdout | default('') | trim }}" but
      this run resolved {{ crewship_shared_supabase_cli_version }}.
    quiet: true
  when: not ansible_check_mode

# --- the fixture volume -------------------------------------------------------

- name: Check whether the fixture volume exists
  ansible.builtin.command:
    argv: [docker, volume, inspect, "{{ crewship_shared_supabase_db_volume }}"]
  become: "{{ crewship_become_target | bool }}"
  become_user: "{{ crewship_cfg.user }}"
  environment: "{{ crewship_user_env }}"
  register: crewship_fleet_volume
  failed_when: false
  changed_when: false
  check_mode: false

- name: Stat the fixture archive
  ansible.builtin.stat:
    path: "{{ crewship_cfg.fleet.fixture_archive }}"
    get_checksum: false
  become: true
  register: crewship_fleet_fixture
  changed_when: false
  check_mode: false
  when: crewship_cfg.fleet.fixture_archive | length > 0

- name: Refuse to start an empty shared stack
  ansible.builtin.assert:
    that:
      - crewship_fleet_volume.rc == 0 or (crewship_fleet_fixture.stat.exists | default(false))
    fail_msg: >-
      No Docker volume {{ crewship_shared_supabase_db_volume }} and no fixture
      archive at "{{ crewship_cfg.fleet.fixture_archive }}". The shared database
      is a fixture that cannot be rebuilt from migrations. Copy the snapshot
      (see {{ crewship_shared_supabase_dir }}/README.md, "Snapshot") to this
      host, set crewship.fleet.fixture_archive to its path, and re-run.
    quiet: true
  when: not ansible_check_mode

- name: Report the fixture restore that check mode cannot perform
  ansible.builtin.debug:
    msg: >-
      check mode: would create volume {{ crewship_shared_supabase_db_volume }}
      from {{ crewship_cfg.fleet.fixture_archive }}.
  when:
    - ansible_check_mode
    - crewship_fleet_volume.rc != 0

- name: Restore the fixture volume from the archive
  when:
    - not ansible_check_mode
    - crewship_fleet_volume.rc != 0
  block:
    - name: Create the fixture volume
      ansible.builtin.command:
        argv: [docker, volume, create, "{{ crewship_shared_supabase_db_volume }}"]
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      changed_when: true

    - name: Unpack the archive into the volume
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ crewship_shared_supabase_db_volume }}:/v"
          - -v
          - "{{ crewship_cfg.fleet.fixture_archive | dirname }}:/b:ro"
          - alpine
          - sh
          - -c
          - "tar xzf /b/{{ crewship_cfg.fleet.fixture_archive | basename }} -C /v"
      become: "{{ crewship_become_target | bool }}"
      become_user: "{{ crewship_cfg.user }}"
      environment: "{{ crewship_user_env }}"
      changed_when: true
