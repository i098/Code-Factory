---
# Crewship - native Ubuntu 24.04 / 26.04 provisioning on x86_64 and
# aarch64. Invoked by `./ship.sh chart` (check mode) and `./ship.sh launch`.
#
# Design rules enforced throughout:
#   * every task is idempotent; a second unchanged apply reports changed=0
#   * no unconditional restarts, daemon-reloads or bare commands
#   * `factory.start_services: false` suppresses linger and every runtime
#     systemd action, but still writes unit files and their static
#     *.target.wants symlinks, so a container image can be built and the same
#     configuration boots correctly on a real host
#   * check mode never mutates: commands are either read-only (check_mode:
#     false) or skipped when ansible_check_mode is true
- name: Crewship native provisioning
  hosts: crewship
  gather_facts: true
  become: false
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300

  pre_tasks:
    - name: Validate configuration, platform and Main-owned inputs
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: [always]

  tasks:
    - name: Target account, home, workspace and user manager
      ansible.builtin.import_tasks: tasks/account.yml
      tags: [account]

    - name: Base and profile apt prerequisites
      ansible.builtin.import_tasks: tasks/packages.yml
      tags: [packages]

    # Everything below writes files owned by the target account, so it needs a
    # resolvable uid. `factory_account_ready` is false only in check mode on a
    # host where the account does not exist yet: `./ship.sh chart` then reports
    # the account work and skips what it cannot preview, instead of failing on
    # an owner that cannot be looked up. On a real apply the account exists by
    # this point and nothing is skipped.
    - name: Toolchain via the repository installer
      ansible.builtin.import_tasks: tasks/tools.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when: factory_account_ready | bool
      tags: [tools]

    - name: Herdr static configuration and user service
      ansible.builtin.import_tasks: tasks/herdr.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when: factory_account_ready | bool
      tags: [herdr]

    - name: Terminal chat client configs
      ansible.builtin.import_tasks: tasks/chat.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.chat | bool
      tags: [chat]

    - name: Agent harness preferences
      ansible.builtin.import_tasks: tasks/agents.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.agents | bool
      tags: [agents]

    - name: Chrome AXI bridge pruning unit and timer
      ansible.builtin.import_tasks: tasks/browser_prune.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.agents | bool
        - factory_cfg.browser_prune.enabled | bool
      tags: [agents, prune]

    - name: Firstmate checkout tracking origin/main and dispatch settings
      ansible.builtin.import_tasks: tasks/firstmate.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.firstmate | bool
      tags: [firstmate]

    - name: Optional iMessage bridge to Firstmate over a Photon Spectrum line
      ansible.builtin.import_tasks: tasks/imessage.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.firstmate | bool
        - factory_cfg.imessage is defined
      tags: [imessage]

    # Runs on every host: without factory.github_board it removes the timer.
    - name: Optional GitHub board for Firstmate work items
      ansible.builtin.import_tasks: tasks/github_board.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when: factory_account_ready | bool
      tags: [github_board]

    # Runs on every host: without factory.board it removes the crew board.
    - name: Optional crew board, a host-local message board for agents
      ansible.builtin.import_tasks: tasks/board.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when: factory_account_ready | bool
      tags: [board]

    - name: Docker engine and Compose v2 from Ubuntu
      ansible.builtin.import_tasks: tasks/docker.yml
      when: factory_cfg.profiles.docker | bool
      tags: [docker]

    - name: CI pool - just-in-time GitHub Actions runners, one job per container
      ansible.builtin.import_tasks: tasks/ci_pool.yml
      when:
        - factory_account_ready | bool
        - factory_cfg.ci_pool is defined
      tags: [ci_pool]

    - name: Fleet guards - Docker guard, reapers and storage guard
      ansible.builtin.import_tasks: tasks/fleet_guards.yml
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.fleet_guards | bool
      tags: [fleet]

    - name: Optional shared Supabase stack, CLI, shim and worktree env seeder
      ansible.builtin.import_tasks: tasks/shared_supabase.yml
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.shared_supabase | bool
      tags: [fleet, shared_supabase]

    - name: Fleet guard units - retire the flotilla units, render and start the crewship ones
      ansible.builtin.import_tasks: tasks/fleet_units.yml
      when:
        - factory_account_ready | bool
        - (factory_cfg.profiles.fleet_guards | bool) or (factory_cfg.profiles.shared_supabase | bool)
      tags: [fleet, shared_supabase]

    - name: Fleet browser ladder - obscura tier, sync timer, gc timer, env injection
      ansible.builtin.import_tasks: tasks/fleet-browsers.yml
      when:
        - factory_account_ready | bool
        - factory_fleet_browsers_enabled | bool
      tags: [fleet, fleet_browsers]

    - name: Tailscale package installation only
      ansible.builtin.import_tasks: tasks/tailscale.yml
      when: factory_cfg.profiles.tailscale | bool
      tags: [tailscale]

    - name: Optional `ssh mac` key and Host entry for an operator Mac
      ansible.builtin.import_tasks: tasks/mac_ssh.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.mac_ssh is defined
      tags: [mac_ssh]

    - name: Koncreet host hardening toolkit, installed but never run
      ansible.builtin.import_tasks: tasks/koncreet.yml
      when: "'koncreet' in factory_latest"
      tags: [koncreet]

    - name: Google Chrome from the official distribution repository
      ansible.builtin.import_tasks: tasks/browser.yml
      when: >-
        (factory_chrome_install | string | lower == 'true')
        or ((factory_chrome_install | string | lower == 'auto')
            and (factory_cfg.profiles.desktop | bool))
      tags: [browser, desktop]

    - name: Loopback-only XFCE / TigerVNC / noVNC desktop
      ansible.builtin.import_tasks: tasks/desktop.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      when:
        - factory_account_ready | bool
        - factory_cfg.profiles.desktop | bool
      tags: [desktop]

  post_tasks:
    # Run notified handlers before anything is verified, so readiness checks
    # observe the reloaded user manager and the restarted services.
    - name: Apply pending unit reloads and restarts before verification
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Verify provisioning outputs
      ansible.builtin.import_tasks: tasks/verify.yml
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_env }}"
      tags: [verify]

  handlers:
    # Handlers run in definition order, so the daemon-reload always precedes
    # the unit restarts it enables.
    - name: Reload the user systemd manager
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: reload user systemd

    - name: Restart the Herdr user service
      ansible.builtin.systemd_service:
        scope: user
        name: herdr.service
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart herdr

    - name: Restart the Docker daemon after a configuration merge
      ansible.builtin.systemd_service:
        name: docker.service
        state: restarted
      become: true
      when: factory_manage_services | bool
      listen: restart docker

    - name: Restart the iMessage bridge
      ansible.builtin.systemd_service:
        scope: user
        name: fm-imessage.service
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart fm-imessage

    - name: Restart the crew board
      ansible.builtin.systemd_service:
        scope: user
        name: crewboard.service
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart crewboard

    - name: Restart journald
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
      become: true
      when: factory_manage_services | bool
      listen: restart journald

    - name: Load the agent host sysctl settings
      ansible.builtin.command:
        argv: [sysctl, -p, /etc/sysctl.d/60-agent-host.conf]
      become: true
      changed_when: true
      when: factory_manage_services | bool
      listen: load agent host sysctl

    - name: Restart fleet browser obscura
      ansible.builtin.systemd_service:
        scope: user
        name: fleet-browser-obscura.service
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart fleet browser obscura

    - name: Restart fleet browser timers
      ansible.builtin.systemd_service:
        scope: user
        name: "{{ item }}"
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      loop:
        - fleet-browser-sync.timer
        - fleet-browser-gc.timer
      when: factory_manage_services | bool
      listen: restart fleet browser timers

    - name: Restart the fleet timers and path watcher
      ansible.builtin.systemd_service:
        scope: user
        name: "{{ item }}"
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      loop: "{{ factory_fleet_enabled_units | map(attribute='unit') | select('match', '.*\\.(timer|path)$') | list }}"
      when: factory_manage_services | bool
      listen: restart fleet timers

    - name: Restart the Chrome autoprune timer
      ansible.builtin.systemd_service:
        scope: user
        name: chrome-autoprune.timer
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart chrome autoprune timer

    - name: Restart the noVNC bridge
      ansible.builtin.systemd_service:
        scope: user
        name: code-factory-novnc.service
        state: restarted
      become: "{{ factory_become_target | bool }}"
      become_user: "{{ factory_cfg.user }}"
      environment: "{{ factory_user_systemd_env }}"
      when: factory_manage_services | bool
      listen: restart novnc

    # Restarting the VNC server kills the live desktop session and every
    # process inside it, so it is reported instead of performed.
    - name: Report that the VNC session must be restarted manually
      ansible.builtin.debug:
        msg: >-
          VNC configuration changed. Restart it when the desktop is idle:
          systemctl --user restart code-factory-vnc.service
          (this terminates everything running inside display
          :{{ factory_cfg.desktop.display }}).
      listen: vnc restart required

    # The no-mistakes daemon serves every pipeline run on the host, and a
    # restart kills the runs in flight, so it is reported instead of performed.
    - name: Report that the no-mistakes daemon must be restarted manually
      ansible.builtin.debug:
        msg: >-
          no-mistakes pipeline agent settings changed. Restart the daemon when
          no pipeline run is active, so new runs load them:
          no-mistakes daemon restart
      listen: no-mistakes daemon restart required
